name: Monthly Data Refresh

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st at 00:00 UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_LINKEDIN_SESSION: ${{ secrets.LINKEDIN_SESSION_B64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: npm ci

      - name: Fetch Google Scholar publications
        run: npm run fetch-scholar

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "staffspy[browser]"

      - name: Decode LinkedIn Session
        if: env.HAS_LINKEDIN_SESSION == 'true'
        env:
          LINKEDIN_SESSION_B64: ${{ secrets.LINKEDIN_SESSION_B64 }}
        run: |
          echo "$LINKEDIN_SESSION_B64" | base64 --decode > data/session.pkl

      - name: Fetch LinkedIn profile data
        if: env.HAS_LINKEDIN_SESSION == 'true'
        continue-on-error: true
        run: |
          python scripts/fetch_linkedin.py < /dev/null

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: monthly data refresh (scholar and linkedin)'
          file_pattern: |-
            data/gscholar.json
            data/linkedin.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
